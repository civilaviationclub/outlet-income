function matrixSections(cols){const sum=a=>a.some(v=>v!==null)?a.reduce((s,n)=>s+(n??0),0):null,get=(c,id)=>c.record?C.scope(c.record,id).v:null,sections=[];const row=(label,id,key,totalRow=false)=>{const vals=cols.map(c=>get(c,id)?.[key]??null);return {label,vals,total:sum(vals),totalRow};};sections.push({title:'FOOD & BEVERAGE SALES',rows:[...groups.map(([id,n])=>row(n+' Sales',id,'sales')),row('Total sales','all','sales',true)]});for(const [id,n] of groups){const keys=[['Opening','opening'],['Purchases','purchases']];keys.push(['Closing','closing'],['Total cost','cogs']);sections.push({title:'COST OF '+n.toUpperCase(),rows:keys.map(([n,key])=>row(n,id,key,key==='cogs'))});}sections.push({title:'GROSS PROFIT MARGIN',percent:true,rows:groups.map(([id,label])=>{const vals=cols.map(c=>get(c,id)?.margin??null),cost=sum(cols.map(c=>get(c,id)?.cogs??null)),sales=sum(cols.map(c=>get(c,id)?.sales??null));return {label,vals,total:cost===null||sales===null?null:C.ratio(sales-cost,sales)};})});sections.push({title:'TOTAL COST OF F&B SALES',rows:[row('Total cost','all','cogs',true)]});return sections;}

async function pdf(matrix=false){try{let result;if(matrix){const cols=columns();if(!cols.some(c=>c.record))return toast('Choose at least one saved month.');result=StatementPdf.makeMatrixPdf({year:reportYear,from:fromMonth,to:toMonth,cols:cols.map(c=>months[Number(c.month.slice(5))-1].toUpperCase()),included:cols.filter(c=>c.record).length,sections:matrixSections(cols)},await logo());}else{const r=record(),err=C.errors(r);if(err.length)return toast(err[0]);const {v,ids}=C.scope(r,view);result=view==='bar'?StatementPdf.makeMatrixPdf({title:'BAR SALES AND STOCK COSTS',period:r.start+' to '+r.end,cols:['MAIN BAR','SEA VIEW BAR','LIQUOR STORE'],totalLabel:'BAR TOTAL',subtitle:'Main Bar + Sea View Bar + Liquor Store',footnote:'Purchases are shared. Cost and percentage are calculated for BAR Total only.',included:3,sections:barReport(r)},await logo()):view==='restaurant'?StatementPdf.makeMatrixPdf({title:'KITCHEN SALES AND STOCK COSTS',period:r.start+' to '+r.end,cols:['DRY STORE','COLD ROOM'],totalLabel:'KITCHEN TOTAL',subtitle:'Kitchen = Dry Store + Cold Room',footnote:'Kitchen opening, purchases and closing each equal Dry Store + Cold Room.',sections:kitchenReport(r)},await logo()):StatementPdf.makePdf([{name:name(view),period:r.start+' to '+r.end,review:ids.every(id=>r.outlets[id].complete)?'Checked':'Draft',lines:[{kind:'heading',label:'Sales and stock costs'},...rows(v).map(([label,n])=>({label,value:fmt(n),kind:label==='Cost of sales'?'total':'row'})),{kind:'total',label:'Gross profit margin',value:pc(v.margin)},...warnings(r,ids).map(label=>({label,kind:'row'}))]}],await logo());}download(`CAC-Sales-Costs-${matrix?reportYear:record().start}.pdf`,result,'application/pdf');toast('PDF downloaded.');}catch(e){toast('PDF not created: '+e.message);}}
function csv(matrix=false){const cell=v=>'"'+String(typeof v==='string'&&/^[=+\-@\t\r]/.test(v)?"'"+v:v).replace(/"/g,'""')+'"';let rows;if(matrix){const cols=columns();rows=[['Report',...cols.map(c=>c.month),'Total']];for(const s of matrixSections(cols)){rows.push([s.title]);for(const r of s.rows)rows.push([r.label,...r.vals.map(n=>n===null?'':s.percent?pc(n):n),r.total===null?'':s.percent?pc(r.total):r.total]);}}else{const r=record();rows=[['From','To','Outlet','Sales','Opening','Purchases','Closing','Cost of sales','Gross profit margin %']];for(const id of ['all','bar',...C.outlets.filter(([id])=>!barIds.includes(id)).map(x=>x[0])]){const v=C.scope(r,id).v;rows.push([r.start,r.end,name(id),v.sales,v.opening,v.purchases,v.closing,v.cogs,v.margin??'']);}}if(!matrix)for(const [id,label] of [['liquor','Liquor Store'],['dry','Dry Store'],['cold','Cold Room']]){const r=record(),o=r.stores?.[id];if(o)rows.push([r.start,r.end,label,'',o.opening,o.purchases??'',o.closing,'','']);}download('CAC-Sales-Costs.csv','\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8');}
document.addEventListener('input',e=>{const t=e.target,r=record();if(!r)return;if(t.dataset.store){r.stores??={};r.stores[t.dataset.store]??={opening:'',closing:''};r.stores[t.dataset.store][t.dataset.stock]=t.value;if(t.dataset.store==='liquor')barIds.forEach(id=>r.outlets[id].complete=false);else r.outlets.restaurant.complete=false;}else if(t.hasAttribute('data-shared-purchases')){r.barPurchases=t.value;for(const id of barIds)r.outlets[id].complete=false;}else if(t.dataset.key){const id=t.dataset.outlet||view;r.outlets[id][t.dataset.key]=t.value;r.outlets[id].complete=false;if($('#reviewed'))$('#reviewed').checked=false;}else if(t.dataset.meta&&t.dataset.meta!=='month')r[t.dataset.meta]=t.value;else return;r.updatedAt=new Date().toISOString();save();update();});
document.addEventListener('change',e=>{const t=e.target,r=record();if(t.id==='records'){active=t.value;render();}if(t.id==='reviewed'){const o=r.outlets[view];if(t.checked&&(C.errors(r).length||['sales','opening','purchases','closing'].some(k=>o[k]==='')||C.calc(o).cogs<0)){t.checked=false;return toast('Complete and check all figures first.');}o.complete=t.checked;save();update();}if(t.dataset.meta==='month'&&/^\d{4}-\d{2}$/.test(t.value))ask('Change statement dates?','Entered figures will be kept.',()=>{const b=C.blank(t.value);r.month=b.month;r.start=b.start;r.end=b.end;save();render();});if(['reportYear','fromMonth','toMonth'].includes(t.id)){const n=Number(t.value);if(t.id==='reportYear')reportYear=Math.max(2000,Math.min(2100,n||2026));if(t.id==='fromMonth')fromMonth=n;if(t.id==='toMonth')toMonth=n;if(fromMonth>toMonth)toMonth=fromMonth;render();}if(t.dataset.choice){choices[t.dataset.choice]=t.value;render();}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;render();window.scrollTo(0,0);}if(['new','newFirst'].includes(b.id))create();if(b.id==='pdf')pdf();if(b.id==='matrixPdf')pdf(true);if(b.id==='csv')csv();if(b.id==='matrixCsv')csv(true);if(b.id==='backup')download(`CAC-Outlet-Income-Backup-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(data,null,2),'application/json');if(b.id==='restore')$('#backupFile').click();if(b.id==='delete')ask('Delete this statement?','This removes this period’s entries. Export a backup first if needed.',()=>{data.records=data.records.filter(r=>r.id!==active);active=data.records.at(-1)?.id||null;save();render();});if(b.id==='duplicate')ask('Copy to next month?','Closing stock becomes opening stock. Sales and purchases start blank. The original is kept.',()=>{const old=record(),[y,m]=old.end.slice(0,7).split('-').map(Number),r=C.blank(new Date(Date.UTC(y,m,1)).toISOString().slice(0,7));for(const [id] of C.outlets)r.outlets[id].opening=old.outlets[id].closing;r.stores=Object.fromEntries(['liquor','dry','cold'].map(id=>[id,{opening:old.stores?.[id]?.closing??'',closing:'',...(['dry','cold'].includes(id)?{purchases:''}:{})}]));data.records.push(r);active=r.id;if(save())render();});});
$('#backupFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>25e6)throw Error('Backup too large.');const incoming=JSON.parse(await file.text());C.validateBackup(incoming);ask('Restore backup?',`Replace this device’s records with ${incoming.records.length} statements? Export a backup first.`,()=>{const old=data;data={app:'cac-outlet-income',version:1,records:incoming.records,revision:data.revision};broken=false;if(save(true)){active=data.records.at(-1)?.id||null;choices={};render();toast('Backup restored.');}else data=old;});}catch(e){toast('Backup not restored: '+e.message);}e.target.value='';};
window.addEventListener('storage',e=>{if(e.key===KEY)toast('Another tab changed the records. Reload before editing.');});window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('#install').hidden=false;});$('#install').onclick=()=>installPrompt?.prompt();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();


</script></body></html>
